name: codeql

# Análisis estático de seguridad de GitHub. Busca inyecciones, fallos de autenticación, uso
# inseguro de criptografía y similares en el código C#. Los resultados salen en la pestaña Security.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cada lunes: aparecen reglas nuevas aunque el código no cambie.
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Compilar
        run: dotnet build Vigia.slnx -c Release
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:csharp"
