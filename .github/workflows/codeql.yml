name: codeql

# Análisis estático de seguridad de GitHub. Busca inyecciones, fallos de autenticación, uso
# inseguro de criptografía y similares en el código C#. Los resultados salen en la pestaña Security.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Cada lunes: aparecen reglas nuevas aunque el código no cambie.
    - cron: "17 5 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Compilar
        run: dotnet build Vigia.slnx -c Release
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
