name: publicar

# En cada versión (un tag v1.2.3): pasa la CI completa y, solo si pasa, construye las tres imágenes (amd64 y arm64), las sube
# a GitHub Container Registry y, si está activado, despliega en el servidor. Para activar el despliegue hacen falta las variables y secretos de
# docs/despliegue.md (paso 7); sin ellos, el flujo solo publica las imágenes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  imagenes:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        imagen: [api, web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre y versión de la imagen
        id: nombre
        run: |
          echo "repositorio=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vigia-${{ matrix.imagen }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.imagen }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.nombre.outputs.repositorio }}:${{ steps.nombre.outputs.version }}
            ${{ steps.nombre.outputs.repositorio }}:latest
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

  desplegar:
    needs: imagenes
    # Solo si se ha activado explícitamente (variable del repositorio DESPLEGAR = true).
    if: vars.DESPLEGAR == 'true'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar SSH
        env:
          CLAVE: ${{ secrets.VIGIA_SSH_CLAVE }}
          HUELLA: ${{ secrets.VIGIA_SSH_HUELLA }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          # La huella del servidor va fijada en un secreto: nunca se acepta «lo que venga».
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts
      - name: Copiar los ficheros de despliegue
        run: |
          scp -i ~/.ssh/id_despliegue -P "${{ vars.VIGIA_SSH_PUERTO || '22' }}" \
            deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh deploy/restaurar.sh deploy/probar-restauracion.sh \
            "vigia@${{ vars.VIGIA_SERVIDOR }}:/opt/vigia/"
      - name: Actualizar
        run: |
          version="${GITHUB_REF_NAME#v}"
          ssh -i ~/.ssh/id_despliegue -p "${{ vars.VIGIA_SSH_PUERTO || '22' }}" "vigia@${{ vars.VIGIA_SERVIDOR }}" \
            "cd /opt/vigia && sed -i 's/^VERSION=.*/VERSION=${version}/' .env && chmod +x *.sh && docker compose pull && docker compose up -d --remove-orphans"
      - name: Esperar a que todo esté sano
        run: |
          ssh -i ~/.ssh/id_despliegue -p "${{ vars.VIGIA_SSH_PUERTO || '22' }}" "vigia@${{ vars.VIGIA_SERVIDOR }}" 'cd /opt/vigia && for i in $(seq 1 40); do
            if [ -z "$(docker compose ps --format "{{.Health}}" | grep -v healthy | grep -v "^$")" ]; then echo "Todo sano"; exit 0; fi
            sleep 3
          done
          docker compose ps; exit 1'
